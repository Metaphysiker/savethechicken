name: savethechicken-production
services:
  webapi:
    image: savethechicken-production-webapi
    ports:
      - "${PORT_WEBAPI}:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./appsettings.Production.json:/app/appsettings.Production.json:ro
      - webapi-temp:/tmp
    depends_on:
      - postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.7'
          memory: 512M  # Increased for production traffic
        reservations:
          cpus: '0.1'
          memory: 128M
  web:
    image: savethechicken-production-web
    env_file:
      - .env
    ports:
      - "${PORT_FRONTEND}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - SERVER_API_BASE_URL=${SERVER_API_BASE_URL}
    depends_on:
      - webapi
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M  # Frontend can cache/buffer data
        reservations:
          cpus: '0.1'
          memory: 128M
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=savethechicken
      - POSTGRES_USER=savethechicken
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M  # Database needs memory for queries/cache
        reservations:
          cpus: '0.05'
          memory: 64M

volumes:
  postgres-data:
  webapi-temp:
