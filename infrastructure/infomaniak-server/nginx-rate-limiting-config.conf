# Nginx Rate Limiting Configuration for SaveTheChicken
# Add this to your nginx configuration

# At the TOP of your nginx.conf (in the http block, BEFORE server blocks):

# Define rate limit zones
# Zone 1: Limit requests per IP address (general traffic)
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

# Zone 2: Stricter limit for API endpoints
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Zone 3: Very strict for login/auth endpoints (prevent brute force)
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

# Connection limit per IP (increased for Blazor SignalR)
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Then in your server block, update like this:

server {
    server_name rettet-das-huhn.stinah.ch;
    
    # Connection limits (max 30 simultaneous connections per IP - higher for Blazor)
    limit_conn addr 30;
    
    # Client body size limit (prevent huge upload attacks)
    client_max_body_size 100M;
    
    # Request timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    
    # CRITICAL: NO rate limiting for Blazor SignalR hub
    # Blazor Server uses /_blazor for all real-time communication
    location /_blazor {
        # No rate limiting - SignalR needs unrestricted access!
        proxy_pass http://localhost:8090/_blazor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        
        # Long timeouts for persistent SignalR connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    
    # Special handling for API endpoints (stricter)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:8091/;  # WebAPI port
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    
    # Very strict for authentication endpoints (prevent brute force)
    location ~ ^/api/(login|register|auth) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://localhost:8091;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    
    # Frontend - moderate rate limiting (increased for Blazor resource loading)
    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://localhost:8090/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        
        # Cache static files
        proxy_cache_valid 200 10m;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rettet-das-huhn.stinah.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rettet-das-huhn.stinah.ch/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = rettet-das-huhn.stinah.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name rettet-das-huhn.stinah.ch;
    listen 80;
    return 404; # managed by Certbot
}

# EXPLANATION:
# - 20r/s = 20 requests per second per IP (1200 requests/min)
# - burst=40 = allow short bursts (like loading a Blazor page with multiple resources)
# - nodelay = reject excess requests immediately (don't queue)
# - zone size 10m = ~160,000 IP addresses can be tracked
# - /_blazor = NO rate limit (Blazor Server SignalR hub - needs unrestricted access)

# BLAZOR SERVER SPECIFIC:
# - Blazor uses SignalR over /_blazor endpoint
# - Reconnections can spike to 10+ requests/second
# - Long polling fallback sends continuous requests
# - NEVER rate limit /_blazor or your app will break!

# To apply changes:
# 1. Edit: sudo nano /etc/nginx/sites-available/default (or your config file)
# 2. Test: sudo nginx -t
# 3. Reload: sudo systemctl reload nginx

# To monitor rate limiting in action:
# sudo tail -f /var/log/nginx/error.log | grep limiting

# To verify Blazor SignalR is working:
# Check browser console for "Blazor connected" or "WebSocket connected"
# Should NOT see "Attempting to reconnect..." stuck
