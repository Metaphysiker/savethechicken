name: savethechicken-development
services:
  webapi:
    build:
      context: ../../
      dockerfile: DockerfileWebApi
    ports:
      - "${PORT_WEBAPI}:8080"
    env_file:
      - .env
    depends_on:
      - postgres
      - mailhog
  dotnet:
    build: ../../tools/dotnet
    volumes:
      - ../../:/app
    env_file:
      - .env
    depends_on:
      - webapi
  web:
    build:
      context: ../../
      dockerfile: DockerfileMauiBlazorWeb
      # Removed API_BASE_URL build arg - using SERVER_API_BASE_URL env var at runtime
    env_file:
      - .env
    ports:
      - "${PORT_FRONTEND}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - API_BASE_URL=${API_BASE_URL}
      - SERVER_API_BASE_URL=http://webapi:8080/
    depends_on:
      - webapi
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=savethechicken
      - POSTGRES_USER=savethechicken
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "${PORT_MAILHOG_SMTP}:1025"  # SMTP server
      - "${PORT_MAILHOG_WEB}:8025"  # Web UI
    environment:
      - MH_STORAGE=memory

volumes:
  postgres-data:
